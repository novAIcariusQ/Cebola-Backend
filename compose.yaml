services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cebola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cebola}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cebola -d cebola"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      CEBOLA_ENV: development
      CEBOLA_SECRET_KEY: ${CEBOLA_SECRET_KEY:?Set CEBOLA_SECRET_KEY in .env}
      CEBOLA_DB_HOST: postgres
      CEBOLA_DB_USER: ${POSTGRES_USER:-cebola}
      CEBOLA_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CEBOLA_DB_NAME: ${POSTGRES_DB:-cebola}
      CEBOLA_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      CEBOLA_ENABLE_DEMO_DATA: "true"
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      MINICPM5_API_BASE: ${MINICPM5_API_BASE:-http://127.0.0.1:8000/v1}
      MINICPM5_MODEL: ${MINICPM5_MODEL:-MiniCPM5}
      MINICPM5_API_KEY: ${MINICPM5_API_KEY:-not-needed}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  api_uploads:
