services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cebola
      POSTGRES_PASSWORD: cebola
      POSTGRES_DB: cebola
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cebola -d cebola"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: cebola
      POSTGRES_PASSWORD: cebola
      POSTGRES_DB: cebola
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  api_uploads:
