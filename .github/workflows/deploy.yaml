name: Deploy

on:
  push:
    branches: [dev, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment
        id: target
        shell: bash
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
            echo "remote_dir=/opt/cebola/prod/backend" >> "$GITHUB_OUTPUT"
            echo "service=cebola-backend-prod" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
            echo "remote_dir=/opt/cebola/dev/backend" >> "$GITHUB_OUTPUT"
            echo "service=cebola-backend-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: mkdir -p ${{ steps.target.outputs.remote_dir }}/uploads

      - name: Upload backend files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: api.py,ai_utils.py,database.py,auth_utils.py,dbInfo.py,stripe_utils.py,order_fulfillment.py,requirements.txt,.env.example
          target: ${{ steps.target.outputs.remote_dir }}
          overwrite: true

      - name: Install dependencies and restart API
        uses: appleboy/ssh-action@v1.2.2
        env:
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          MINICPM5_API_BASE: ${{ secrets.MINICPM5_API_BASE }}
          MINICPM5_MODEL: ${{ secrets.MINICPM5_MODEL }}
          MINICPM5_API_KEY: ${{ secrets.MINICPM5_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CURRENCY: ${{ secrets.STRIPE_CURRENCY }}
          STRIPE_SUCCESS_URL: ${{ secrets.STRIPE_SUCCESS_URL }}
          STRIPE_CANCEL_URL: ${{ secrets.STRIPE_CANCEL_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GOOGLE_VISION_API_KEY,MINICPM5_API_BASE,MINICPM5_MODEL,MINICPM5_API_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_CURRENCY,STRIPE_SUCCESS_URL,STRIPE_CANCEL_URL,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM_EMAIL,SMTP_USE_TLS
          script: |
            set -e
            cd ${{ steps.target.outputs.remote_dir }}
            if [ ! -d venv ]; then
              python3 -m venv venv
            fi
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            touch .env.local
            set_env() {
              FILE="$1"
              KEY="$2"
              VALUE="$3"
              if grep -q "^${KEY}=" "${FILE}"; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" "${FILE}"
              else
                echo "${KEY}=${VALUE}" >> "${FILE}"
              fi
            }
            if [ -n "${GOOGLE_VISION_API_KEY}" ]; then
              set_env .env.local GOOGLE_VISION_API_KEY "${GOOGLE_VISION_API_KEY}"
            fi
            MINICPM5_API_BASE_VALUE="${MINICPM5_API_BASE:-http://127.0.0.1:8000/v1}"
            MINICPM5_MODEL_VALUE="${MINICPM5_MODEL:-MiniCPM5}"
            MINICPM5_API_KEY_VALUE="${MINICPM5_API_KEY:-not-needed}"
            set_env .env.local MINICPM5_API_BASE "${MINICPM5_API_BASE_VALUE}"
            set_env .env.local MINICPM5_MODEL "${MINICPM5_MODEL_VALUE}"
            set_env .env.local MINICPM5_API_KEY "${MINICPM5_API_KEY_VALUE}"
            if [ -n "${STRIPE_SECRET_KEY}" ]; then
              set_env .env.local STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY}"
            fi
            if [ -n "${STRIPE_WEBHOOK_SECRET}" ]; then
              set_env .env.local STRIPE_WEBHOOK_SECRET "${STRIPE_WEBHOOK_SECRET}"
            fi
            STRIPE_CURRENCY_VALUE="${STRIPE_CURRENCY:-eur}"
            set_env .env.local STRIPE_CURRENCY "${STRIPE_CURRENCY_VALUE}"
            if [ -n "${STRIPE_SUCCESS_URL}" ]; then
              set_env .env.local STRIPE_SUCCESS_URL "${STRIPE_SUCCESS_URL}"
            fi
            if [ -n "${STRIPE_CANCEL_URL}" ]; then
              set_env .env.local STRIPE_CANCEL_URL "${STRIPE_CANCEL_URL}"
            fi
            if [ -n "${SMTP_HOST}" ]; then
              set_env .env.local SMTP_HOST "${SMTP_HOST}"
            fi
            SMTP_PORT_VALUE="${SMTP_PORT:-587}"
            set_env .env.local SMTP_PORT "${SMTP_PORT_VALUE}"
            if [ -n "${SMTP_USERNAME}" ]; then
              set_env .env.local SMTP_USERNAME "${SMTP_USERNAME}"
            fi
            if [ -n "${SMTP_PASSWORD}" ]; then
              set_env .env.local SMTP_PASSWORD "${SMTP_PASSWORD}"
            fi
            if [ -n "${SMTP_FROM_EMAIL}" ]; then
              set_env .env.local SMTP_FROM_EMAIL "${SMTP_FROM_EMAIL}"
            fi
            SMTP_USE_TLS_VALUE="${SMTP_USE_TLS:-true}"
            set_env .env.local SMTP_USE_TLS "${SMTP_USE_TLS_VALUE}"
            chmod 600 .env.local
            python3 -m py_compile api.py ai_utils.py stripe_utils.py order_fulfillment.py
            systemctl restart ${{ steps.target.outputs.service }}
            systemctl is-active --quiet ${{ steps.target.outputs.service }}
            sleep 3
            for attempt in 1 2 3 4 5; do
              HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/api/auth/me 2>/dev/null || echo "000")
              if [ "${HTTP_CODE}" = "401" ] || [ "${HTTP_CODE}" = "200" ]; then
                exit 0
              fi
              sleep 2
            done
            echo "Backend health check failed after restart"
            exit 1
